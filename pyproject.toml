[project]
name = "rag-project"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.23.0",
    "numpy>=2.5.3",
    "pgvector>=0.5.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
]


[tool.fastapi]
entrypoint = "app.main:app"
